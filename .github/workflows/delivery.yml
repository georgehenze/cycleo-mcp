name: Delivery

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const expected = `v${pkg.version}`;
          if (lock.version !== pkg.version || lock.packages[''].version !== pkg.version) {
            console.error('package-lock.json version does not match package.json');
            process.exit(1);
          }
          if (process.env.GITHUB_REF_NAME !== expected) {
            console.error(`Expected tag ${expected}, received ${process.env.GITHUB_REF_NAME}`);
            process.exit(1);
          }
          NODE

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_ROOT: /var/www/cycleo.mcp
      SYSTEMD_SERVICE: ${{ vars.SYSTEMD_SERVICE || 'cycleo-mcp.service' }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || 'http://127.0.0.1:8787/healthz' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          [[ -n "$SSH_HOST" ]]
          [[ -n "$SSH_USER" ]]
          [[ -n "$SSH_PRIVATE_KEY" ]]
          [[ -n "$SSH_KNOWN_HOSTS" ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SYSTEMD_SERVICE" =~ ^[A-Za-z0-9_.@-]+$ ]]
          [[ "$HEALTHCHECK_URL" =~ ^http://(127\.0\.0\.1|localhost):[0-9]+/[A-Za-z0-9_./-]+$ ]]

      - name: Create release archive
        run: tar --create --gzip --file "cycleo-mcp-${GITHUB_SHA}.tar.gz" package.json package-lock.json src README.md docs

      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/deploy_key"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Upload release archive
        run: |
          scp -P "$SSH_PORT" \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "cycleo-mcp-${GITHUB_SHA}.tar.gz" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_ROOT/.incoming-${GITHUB_SHA}.tar.gz"

      - name: Deploy and verify service
        run: |
          ssh -p "$SSH_PORT" \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DEPLOY_ROOT/.incoming-${GITHUB_SHA}.tar.gz' '$DEPLOY_ROOT' '$SYSTEMD_SERVICE' '$GITHUB_SHA' '$HEALTHCHECK_URL'" \
            < ops/deploy-systemd.sh
